caveat: >-
  These are modeled workbook estimates, not metered measurements. Annual excess heat is summed from the province and
  territory sheets; two of the 2,893 records have no area-based heat estimate. Gross
  waste heat before internal heating demand is provided separately. The workbook does not calculate avoided CO2 or a
  technically recoverable percentage. The monthly profile is based on lower-bound quarterly excess-heat totals,
  divided evenly among months in each quarter; the indices are not measured monthly energy quantities. The upper
  annual estimate is calculated from quarterly excess-heat totals because the Newfoundland annual upper-bound formula
  in the workbook references Nova Scotia data.
