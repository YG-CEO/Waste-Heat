  note: "Data centers calculations.xlsx estimates 10,998,509-21,997,018 MWh/year from 296 populated calculation rows (the sheet header lists 377 total buildings); the lower bound is used here. Annual heat is estimated as total power x load factor x 8,760 hours / PUE. Matching supply temperature to nearby heating networks is key."

caveat: >-
  Annual heat, household equivalents, and the flat monthly profile are derived from the workbook estimates. The
  recoverable-potential percentage and avoided CO2 value remain illustrative because the workbook does not calculate
  them. Heat stream shares are shown as one unallocated total because the workbook does not disaggregate streams.
  Validate values and assumptions against local measurements and sources before planning or investment decisions.
  Monthly profile values are relative display indices, not measured monthly energy quantities.
