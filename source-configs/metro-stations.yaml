  relativeHumidityAt1500LST: "fraction (e.g. 0.393 = 39.3%)"
  dailyAverageTemperature: degC
  airTemperature: degC
  saturationVaporPressure: Pa

calculations:
  saturationVaporPressure:
    formula: "e_s = C1 * exp((A1 * t) / (B1 + t))"
