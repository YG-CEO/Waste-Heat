caveat: >-
  Annual heat and household equivalents are workbook estimates, not metered measurements. The monthly profile is derived
  from the workbook's quarterly lower-bound excess-heat totals, divided evenly across months in each quarter and
  normalized to the highest month; the index is not measured monthly energy. The workbook does not calculate avoided
  CO2 or a technically recoverable percentage. Validate assumptions against local measurements before planning or
  investment decisions.
